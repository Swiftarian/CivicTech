# Pre-commit hooks 設定
# 每次 git commit 前會自動執行這些檢查
# 安裝方式: pip install pre-commit && pre-commit install

repos:
  # 使用本地 Semgrep (避免 Windows 相容性問題)
  - repo: local
    hooks:
      - id: semgrep
        name: Semgrep Security Scan
        entry: powershell -Command "$env:PYTHONUTF8='1'; semgrep scan --config auto --error --quiet"
        language: system
        types: [python]
        pass_filenames: false

  # Python 程式碼格式檢查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
